# Checks for G.I.G.A.S: front-end types, tests and build; back-end tests and lint.
# Runs on pull requests and when started by hand (Actions tab, "Run workflow"),
# so pushes to working branches do not use the repository's Actions minutes.
name: checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # 22.18+ runs the TypeScript tests directly
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv run pytest -q
      - run: uv run ruff check .
