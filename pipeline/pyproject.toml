[project]
name = "sars-pipeline"
version = "0.1.0"
description = "NISAR GCOV ingest, contract export, and live data server"
readme = "README.md"
authors = [
    { name = "StarL0st", email = "65464466+StarL0st@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "h5py>=3.16.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyproj>=3.8.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
sars-pipeline = "sars_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
