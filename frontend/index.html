<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dancing with the SARs</title>
  </head>
  <body>
    <header>
      <h1>Dancing with the SARs</h1>
      <button type="button" id="tour-btn">Tutorial</button>
      <div id="banner" role="status" hidden>Sample data: placeholder areas and reports, not real observations</div>
    </header>
    <main class="app">
      <nav aria-label="Themes and areas">
        <h3>Themes</h3>
        <div id="tabs" role="group" aria-label="Filter areas by theme"></div>
        <div id="topics"></div>
        <h3>Areas</h3>
        <p id="status" class="muted" role="status"></p>
        <ul id="results"></ul>
      </nav>
      <div id="map" role="region" aria-label="Globe of radar study areas"></div>
      <aside id="detail" aria-label="Selected area"></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
