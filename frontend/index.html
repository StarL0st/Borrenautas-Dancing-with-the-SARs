<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G.I.G.A.S</title>
  </head>
  <body>
    <header>
      <h1>G.I.G.A.S</h1>
      <button type="button" id="tour-btn" data-i18n="btn.tutorial"></button>
      <div id="mode" class="mode" role="radiogroup" aria-labelledby="mode-label">
        <span id="mode-label" class="muted" data-i18n="mode.label"></span>
        <div id="mode-seg" class="seg"></div>
      </div>
      <button type="button" id="settings-btn" data-i18n="btn.settings"></button>
      <div id="banner" role="status" hidden></div>
    </header>
    <main class="app">
      <nav id="nav" data-i18n-label="nav.label">
        <h3 data-i18n="h.filters"></h3>
        <div id="filters"></div>
        <h3 data-i18n="h.live"></h3>
        <p class="muted" data-i18n="live.scope"></p>
        <label class="check"><input type="checkbox" id="live-toggle" checked /> <span data-i18n="live.toggle"></span></label>
        <div class="slider-row">
          <label for="live-level" data-i18n="live.level"></label>
          <input type="range" id="live-level" min="0" max="3" step="1" value="1" />
          <output id="live-level-out" for="live-level"></output>
        </div>
        <section id="live-top" class="top" aria-labelledby="live-top-title">
          <h4 id="live-top-title" data-i18n="h.top"></h4>
          <ul id="live-top-list"></ul>
        </section>
        <p id="live-status" class="muted" role="status"></p>
        <ul id="live-list" data-i18n-label="live.list"></ul>
        <button type="button" id="live-more" class="link" hidden></button>
        <h3 data-i18n="h.recent"></h3>
        <p id="recent-note" class="muted"></p>
        <ol id="recent-list" class="recent"></ol>
        <h3 data-i18n="h.infra"></h3>
        <button type="button" id="infra-locate" class="primary" data-i18n="infra.locate"></button>
        <p id="infra-status" class="muted" role="status"></p>
        <div class="slider-row">
          <label for="infra-radius" data-i18n="infra.radius"></label>
          <input type="range" id="infra-radius" min="25" max="400" step="25" value="150" />
          <output id="infra-radius-out" for="infra-radius"></output>
        </div>
        <ul id="infra-list" class="infra"></ul>
        <h3 class="tech" data-i18n="h.coords"></h3>
        <form id="coords" class="tech">
          <label for="lat" data-i18n="coords.lat"></label>
          <input id="lat" type="number" min="-90" max="90" step="any" required placeholder="19.43" />
          <label for="lon" data-i18n="coords.lon"></label>
          <input id="lon" type="number" min="-180" max="180" step="any" required placeholder="-99.13" />
          <div class="actions">
            <button type="submit" class="primary" data-i18n="coords.go"></button>
            <button type="button" id="process" data-i18n="coords.process"></button>
          </div>
        </form>
        <h3 data-i18n="h.areas"></h3>
        <p id="status" class="muted" role="status"></p>
        <ul id="results"></ul>
      </nav>
      <div class="stage" id="stage">
        <div id="map" role="region" data-i18n-label="map.label"></div>
        <div class="toolbar" id="toolbar" role="group" data-i18n-label="view.label">
          <button type="button" id="view-globe" aria-pressed="true" data-i18n="view.globe"></button>
          <button type="button" id="view-closeup" aria-pressed="false" data-i18n="view.closeup"></button>
          <button type="button" id="spin-btn" aria-pressed="false" data-i18n="view.spin"></button>
          <button type="button" id="wheel-btn" aria-pressed="true" data-i18n="view.wheel"></button>
          <div class="zoom"><input type="range" id="zoom" min="0.5" max="12" step="0.1" data-i18n-label="wheel.zoom" /></div>
        </div>
        <div id="wheel" role="group" data-i18n-label="view.wheel"></div>
        <button type="button" class="panel-toggle" id="nav-toggle" aria-controls="nav" aria-expanded="true" data-i18n-label="panel.nav"><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M7 3 3 8l4 5" /></svg></button>
        <button type="button" class="panel-toggle tech" id="detail-toggle" aria-controls="detail" aria-expanded="true" data-i18n-label="panel.detail"><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M7 3 3 8l4 5" /></svg></button>
      </div>
      <aside id="detail" class="tech" data-i18n-label="h.open">
        <h2 data-i18n="h.open"></h2>
        <div id="cards"></div>
      </aside>
    </main>
    <dialog id="settings" aria-labelledby="settings-title"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
