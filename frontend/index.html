<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dancing with the SARs</title>
  </head>
  <body>
    <header>
      <h1>Dancing with the SARs</h1>
      <button type="button" id="tour-btn" data-i18n="btn.tutorial"></button>
      <button type="button" id="settings-btn" data-i18n="btn.settings"></button>
      <div id="banner" role="status" hidden></div>
    </header>
    <main class="app">
      <nav data-i18n-label="nav.label">
        <h3 data-i18n="h.filters"></h3>
        <div id="filters"></div>
        <h3 data-i18n="h.coords"></h3>
        <form id="coords">
          <label for="lat" data-i18n="coords.lat"></label>
          <input id="lat" type="number" min="-90" max="90" step="any" required placeholder="19.43" />
          <label for="lon" data-i18n="coords.lon"></label>
          <input id="lon" type="number" min="-180" max="180" step="any" required placeholder="-99.13" />
          <div class="actions">
            <button type="submit" class="primary" data-i18n="coords.go"></button>
            <button type="button" id="process" data-i18n="coords.process"></button>
          </div>
        </form>
        <h3 data-i18n="h.areas"></h3>
        <p id="status" class="muted" role="status"></p>
        <ul id="results"></ul>
      </nav>
      <div class="stage" id="stage">
        <div id="map" role="region" data-i18n-label="map.label"></div>
        <div class="toolbar" id="toolbar" role="group" data-i18n-label="view.label">
          <button type="button" id="view-globe" aria-pressed="true" data-i18n="view.globe"></button>
          <button type="button" id="view-closeup" aria-pressed="false" data-i18n="view.closeup"></button>
          <button type="button" id="spin-btn" aria-pressed="false" data-i18n="view.spin"></button>
          <button type="button" id="wheel-btn" aria-pressed="true" data-i18n="view.wheel"></button>
        </div>
        <div id="wheel" role="group" data-i18n-label="view.wheel"></div>
      </div>
      <aside id="detail" data-i18n-label="h.open">
        <h2 data-i18n="h.open"></h2>
        <div id="cards"></div>
      </aside>
    </main>
    <dialog id="settings" aria-labelledby="settings-title"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
